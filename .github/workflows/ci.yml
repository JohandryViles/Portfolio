name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Align npm with lockfile
        run: npm install -g npm@11.6.2 --ignore-scripts

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  # CD: el repo está enlazado en Vercel (proyecto devjohandry). Cada push a main
  # y cada PR despliegan desde el dashboard de Vercel automáticamente.
